<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Housing Starts and SPF Price</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    body {
      margin: 0;
      padding: 10px;
      font-family: Arial, sans-serif;
    }

    .chart-container {
      border: 1px solid #d0d0d0;
      padding: 10px;
    }

    .custom-legend {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-top: 16px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      color: #666;
    }

    .legend-item {
      display: flex;
      align-items: center;
    }

    .legend-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ED7D31;
      margin-right: 8px;
    }

    .legend-bar {
      width: 40px;
      height: 20px;
      background: #3775C8;
      margin-right: 8px;
    }

  </style>

</head>

<body>

  <div class="chart-container">

    <canvas id="myChart"></canvas>

    <div class="custom-legend">

      <div class="legend-item">
        <span class="legend-circle"></span>
        <span>SPF 2x4 price (US$/mbf)</span>
      </div>

      <div class="legend-item">
        <span class="legend-bar"></span>
        <span>U.S. housing starts (000s)</span>
      </div>

    </div>

  </div>

  <script>

  fetch('../data/housing-starts.json')
    .then(response => response.json())
    .then(data => {
  
      const years =
        data.map(d => d.YEAR);
  
      const housingStarts =
        data.map(d => d.US_HOUSING_STARTS);
  
      const spfPrice =
        data.map(d => d.SPF_2X4_PRICE);
  
    new Chart(document.getElementById('myChart'), {

      data: {
        labels: years,

        datasets: [
          {
            type: 'bar',
            label: 'U.S. housing starts (000s)',
            data: housingStarts,
            backgroundColor: '#3775C8',
            yAxisID: 'housing',
            order: 2
          },
          {
            type: 'line',
            label: 'SPF 2x4 price (US$/mbf)',
            data: spfPrice,
            borderColor: '#ED7D31',
            backgroundColor: '#ED7D31',
            borderWidth: 4,
            pointRadius: 6,
            pointHoverRadius: 6,
            tension: 0,
            yAxisID: 'price',
            order: 1
          }
        ]
      },

      options: {

        responsive: true,

        plugins: {

          title: {
            display: true,
            text: 'U.S. housing starts and the SPF 2x4 lumber price',
            font: {
              size: 24,
              weight: 'bold'
            }
          },

          legend: {
            display: false
          }

        },

        scales: {

          x: {
            ticks: {
              font: {
                size: 14
              }
            }
          },

          housing: {
            type: 'linear',
            position: 'left',

            title: {
              display: true,
              text: 'housing starts (000s)',
              font: {
                size: 16
              }
            },

            ticks: {
              font: {
                size: 14
              }
            }
          },

          price: {
            type: 'linear',
            position: 'right',

            title: {
              display: true,
              text: 'US$ per mbf',
              font: {
                size: 16
              }
            },

            ticks: {
              font: {
                size: 14
              }
            },

            grid: {
              drawOnChartArea: false
            }
          }

        }

      }

    });
  });

  </script>

</body>
</html>
